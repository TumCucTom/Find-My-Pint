name: FindMyPint
options:
  bundleIdPrefix: com.findmypint
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait

targets:
  FindMyPint:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FindMyPint
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.findmypint.app
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Find My Pint needs your location to show pubs near you on the map."
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "Find My Pint needs your location to notify you when you're near a pub."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
